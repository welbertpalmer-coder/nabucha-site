<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:Unb;src:url(https://cdn.jsdelivr.net/npm/@fontsource/unbounded/files/unbounded-latin-900-normal.woff2)}
@font-face{font-family:Fig;src:url(https://cdn.jsdelivr.net/npm/@fontsource/figtree/files/figtree-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Fig;src:url(https://cdn.jsdelivr.net/npm/@fontsource/figtree/files/figtree-latin-600-normal.woff2);font-weight:600}
@page{size:A4;margin:0}html,body{margin:0}
.pg{width:210mm;height:297mm;box-sizing:border-box;padding:9mm 10mm 8mm;display:flex;flex-direction:column;align-items:center}
h1{font-family:Unb;font-size:40pt;margin:0;color:#fff;-webkit-text-stroke:2.2pt #111;paint-order:stroke fill;letter-spacing:1pt;line-height:1}
.sub{font-family:Fig;font-weight:700;font-size:13pt;margin:2mm 0 3mm;color:#111}
.arte{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.arte img{height:100%;max-width:100%;object-fit:contain}
.campos{width:100%;font-family:Fig;font-weight:700;font-size:13pt;color:#111;margin-top:3mm}
.campos div{display:flex;gap:3mm;align-items:flex-end;margin-top:4mm}
.campos span.l{flex:1;border-bottom:1.4pt dotted #111;height:1em}
.rod{font-family:Fig;font-weight:600;font-size:9pt;color:#444;margin-top:4mm;text-align:center}
</style></head><body><div class="pg">
<h1>PINTE A CAPI!</h1>
<div class="sub">A Capi é pintora, igual a muita gente que você conhece.</div>
<div class="arte"><img src="capi-pintora-arte.png" alt=""></div>
<div class="campos"><div>Meu nome:<span class="l"></span></div><div>Quem eu conheço que é pintor(a):<span class="l"></span></div></div>
<div class="rod">A Capi é a mascote do Na Bucha, o app de orçamento para quem trabalha por conta · nabucha.com.br</div>
</div></body></html>
